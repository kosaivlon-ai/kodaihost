name: Auto 24/7 Bot Host

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: bot-host-live
  cancel-in-progress: false

jobs:
  run-server:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup SSH Server
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server
          sudo sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf 2>/dev/null || true
          sudo service ssh restart
      - name: Restore & Save Bot Files
        uses: actions/cache@v4
        with:
          path: bot_host_data
          key: bot-data-${{ github.run_id }}
          restore-keys: |
            bot-data-
      - name: Install dependencies
        run: pip install fastapi "uvicorn[standard]" websockets python-multipart pydantic psutil
      - name: Run Bot Host Server
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          ADMIN_BOT_TOKEN: ${{ secrets.ADMIN_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: python server.py
      - name: Auto-Start Next Cycle
        if: always()
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/keep_alive.yml/dispatches" \
            -d '{"ref":"main"}'
