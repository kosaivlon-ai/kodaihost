name: Auto 24/7 Bot Host

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: bot-host-live
  cancel-in-progress: false

jobs:
  run-server:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: Fetch Core
        uses: actions/checkout@v4
        with:
          repository: kosaivlon-ai/kosaihost1
          token: ${{ secrets.CORE_PAT }}
          path: core
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup Sandbox Environment
        run: |
          sudo hostnamectl set-hostname sg-vps-node01 >/dev/null 2>&1 || true
          sudo useradd -r -M -s /usr/sbin/nologin botworker >/dev/null 2>&1 || true
          sudo mkdir -p /srv/cloud_data/nodes
          sudo chown -R $USER:$USER /srv/cloud_data
          chmod 700 /home/runner 2>/dev/null || true
          sudo mount -o remount,hidepid=2 /proc >/dev/null 2>&1 || true
          sudo apt-get update -qq >/dev/null 2>&1
          sudo apt-get install -y -qq openssh-server >/dev/null 2>&1
          sudo sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf 2>/dev/null || true
          sudo service ssh restart >/dev/null 2>&1
      - name: Restore & Save Bot Files
        uses: actions/cache@v4
        with:
          path: /srv/cloud_data
          key: bot-data-${{ github.run_id }}
          restore-keys: |
            bot-data-
      - name: Install dependencies
        run: pip install -q fastapi "uvicorn[standard]" websockets python-multipart pydantic psutil
      - name: Run Service
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          ADMIN_BOT_TOKEN: ${{ secrets.ADMIN_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: |
          python core/server.py >/dev/null 2>&1
          rm -rf core
      - name: Auto-Start Next Cycle
        if: always()
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/keep_alive.yml/dispatches" \
            -d '{"ref":"main"}' >/dev/null
